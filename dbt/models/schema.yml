version: 2

models:
  - name: dim_customers
    description: "Enriched customer dimension table"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null

  - name: dim_products
    description: "Enriched product dimension table"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: price
        tests:
          - not_null

  - name: fct_orders
    description: "Transactional order fact table"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

  - name: fct_monthly_financials
    description: "Monthly business financial mart"
    columns:
      - name: order_year
        tests:
          - not_null
      - name: order_month
        tests:
          - not_null
